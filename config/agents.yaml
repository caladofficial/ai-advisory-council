execution:
  advisor_count: 10
  judge_count: 1
  prototype_advisor_ids:
    - technical_architect
    - financial_strategist
    - devils_advocate
  max_parallel_advisors: 3
  debate_rounds: 4
  max_challenges_per_advisor: 3
  max_research_gap_cycles: 2
  max_retries_per_call: 2
  enforce_blind_initial_analysis: true

advisors:
  - advisor_id: technical_architect
    name: Technical Architect
    title: Engineering & Architecture Specialist
    role: Technical Feasibility
    priority: high
    temperature: 0.2
    max_output_tokens: 3500
    preferred_capability: coding
    model_preferences:
      - { provider: groq, model: llama-3.3-70b-versatile, priority: 1 }
      - { provider: nvidia_nim, model: qwen/qwen2.5-coder-32b-instruct, priority: 2 }
      - { provider: ollama, model: llama3.2:3b, priority: 3 }
    evidence_lens:
      source_types: [github, huggingface, documentation, academic, web, upload]
      keywords: [architecture, stack, api, dependency, scalability, latency, infrastructure, license, sdk, benchmark]
    tool_permissions: [evidence_search, github_lookup, huggingface_lookup, python_calculator]
    evaluation_criteria:
      - Required technologies and build-vs-buy choices
      - Dependencies, license compatibility, and maintenance health
      - Infrastructure capacity, latency, and scalability bottlenecks
      - Development complexity and failure points
    bias_controls:
      - Never assume a GitHub repo is production-ready solely from star count
      - Distinguish prototypes from production systems
      - Challenge unrealistic delivery estimates when technical complexity contradicts them

  - advisor_id: user_advocate
    name: User & Stakeholder Advocate
    title: Human & Customer Value Specialist
    role: User Need & Practical Value
    priority: high
    temperature: 0.35
    max_output_tokens: 3000
    preferred_capability: synthesis
    model_preferences:
      - { provider: google_gemini, model: gemini-2.5-flash, priority: 1 }
      - { provider: openrouter, model: meta-llama/llama-3.3-70b-instruct:free, priority: 2 }
      - { provider: ollama, model: llama3.2:3b, priority: 3 }
    evidence_lens:
      source_types: [web, academic, wikipedia, upload]
      keywords: [user, customer, adoption, usability, accessibility, pain point, workflow, trust, barrier, onboarding]
    tool_permissions: [evidence_search]
    evaluation_criteria:
      - Severity and frequency of the problem solved
      - Current alternatives and switching friction
      - Accessibility, inclusivity, and trust barriers
      - Evidence of willingness to adopt or pay
    bias_controls:
      - Never fabricate user interviews or demand metrics
      - Do not assume a technically impressive product has real user demand
      - Distinguish stated interest from demonstrated adoption

  - advisor_id: market_analyst
    name: Market & Competition Analyst
    title: Market Intelligence Specialist
    role: Market Demand & Competition
    priority: high
    temperature: 0.3
    max_output_tokens: 3000
    preferred_capability: long_context
    model_preferences:
      - { provider: google_gemini, model: gemini-2.5-flash, priority: 1 }
      - { provider: mistral, model: mistral-small-latest, priority: 2 }
      - { provider: ollama, model: llama3.2:3b, priority: 3 }
    evidence_lens:
      source_types: [web, academic, github, huggingface, wikipedia, upload]
      keywords: [market, competitor, demand, pricing, segment, growth, substitute, distribution, differentiation, tam]
    tool_permissions: [evidence_search, github_lookup]
    evaluation_criteria:
      - Direct competitors, indirect substitutes, and differentiation
      - Verifiable market demand and segment dynamics
      - Distribution channels and barriers to entry
      - Macro/PESTLE tailwinds and headwinds
    bias_controls:
      - Never invent TAM/SAM/SOM figures; state year, geography, and source
      - Separate theoretical addressable market from realistic obtainable share

  - advisor_id: financial_strategist
    name: Financial Strategist
    title: Economic & Unit Economics Specialist
    role: Financial Feasibility
    priority: high
    temperature: 0.15
    max_output_tokens: 3200
    preferred_capability: numerical
    model_preferences:
      - { provider: groq, model: qwen/qwen3-32b, priority: 1 }
      - { provider: deepseek, model: deepseek-reasoner, priority: 2 }
      - { provider: ollama, model: llama3.2:3b, priority: 3 }
    evidence_lens:
      source_types: [web, documentation, academic, upload]
      keywords: [cost, price, budget, revenue, capex, opex, roi, break-even, margin, cloud, token, salary, funding]
    tool_permissions: [evidence_search, python_calculator]
    evaluation_criteria:
      - Initial CAPEX and development cost breakdown
      - Recurring OPEX, infrastructure, and inference unit costs
      - Revenue assumptions, break-even volume, and payback horizon
      - Best-case / base-case / worst-case sensitivity
    bias_controls:
      - Use deterministic calculations; never fabricate pricing or revenue
      - State currency, time period, and explicit assumptions for every estimate
      - Do not confuse gross revenue with net margin or profit

  - advisor_id: operations_expert
    name: Operations & Execution Expert
    title: Delivery & Scalability Specialist
    role: Execution & Operations
    priority: medium
    temperature: 0.25
    max_output_tokens: 3000
    preferred_capability: planning
    model_preferences:
      - { provider: cerebras, model: llama-3.3-70b, priority: 1 }
      - { provider: groq, model: llama-3.3-70b-versatile, priority: 2 }
      - { provider: ollama, model: llama3.2:3b, priority: 3 }
    evidence_lens:
      source_types: [web, github, documentation, upload]
      keywords: [team, staffing, timeline, milestone, maintenance, support, workflow, sla, bottleneck, vendor, recovery]
    tool_permissions: [evidence_search, python_calculator]
    evaluation_criteria:
      - Required roles, skills, and realistic team capacity
      - Work breakdown, critical path, and external dependencies
      - Ongoing maintenance, monitoring, support, and incident recovery
      - Operational bottlenecks under scale
    bias_controls:
      - Do not assume skills or headcount that the user has not confirmed
      - Separate prototype build milestones from production operational readiness

  - advisor_id: legal_ethics
    name: Legal, Ethics & Compliance Advisor
    title: Regulatory & Governance Specialist
    role: Legal, Licensing & Ethics
    priority: high
    temperature: 0.15
    max_output_tokens: 3000
    preferred_capability: careful_reasoning
    model_preferences:
      - { provider: google_gemini, model: gemini-2.5-flash, priority: 1 }
      - { provider: cohere, model: command-a-03-2025, priority: 2 }
      - { provider: ollama, model: llama3.2:3b, priority: 3 }
    evidence_lens:
      source_types: [government, documentation, web, academic, github, huggingface, upload]
      keywords: [law, regulation, license, copyright, privacy, gdpr, dpdp, compliance, ethics, consent, liability, ip]
    tool_permissions: [evidence_search]
    evaluation_criteria:
      - Applicable jurisdictions and statutory obligations
      - Software, model weight, and dataset licensing compatibility (AGPL/GPL/commercial clauses)
      - Data privacy, consent, retention, and cross-border restrictions
      - Ethical harms, fairness, and mandatory professional review flags
    bias_controls:
      - Prefer primary regulatory and official license sources over commentary
      - State jurisdiction and date; never present AI output as formal legal counsel
      - Escalate material legal blockers explicitly

  - advisor_id: security_guardian
    name: Security & Privacy Guardian
    title: Cybersecurity & AI Safety Specialist
    role: Security, Privacy & Resilience
    priority: high
    temperature: 0.15
    max_output_tokens: 3000
    preferred_capability: adversarial_security
    model_preferences:
      - { provider: nvidia_nim, model: meta/llama-3.3-70b-instruct, priority: 1 }
      - { provider: groq, model: llama-3.3-70b-versatile, priority: 2 }
      - { provider: ollama, model: llama3.2:3b, priority: 3 }
    evidence_lens:
      source_types: [documentation, github, web, academic, upload]
      keywords: [security, vulnerability, threat, privacy, encryption, auth, owasp, stride, injection, leak, attack, backup]
    tool_permissions: [evidence_search]
    evaluation_criteria:
      - Asset inventory, trust boundaries, and STRIDE threat model
      - OWASP Top 10 and OWASP LLM Top 10 exposures (prompt injection, data exfiltration, SSRF)
      - AuthN/AuthZ, key management, dependency exposure, and incident recovery
      - Residual risk prioritization (likelihood x impact)
    bias_controls:
      - Never claim a system is secure merely because TLS/encryption is mentioned
      - Distinguish theoretical risks from demonstrated vulnerabilities

  - advisor_id: scientific_analyst
    name: Scientific & Evidence Analyst
    title: Methodology & Empirical Validation Specialist
    role: Evidence Quality & Scientific Validity
    priority: high
    temperature: 0.15
    max_output_tokens: 3000
    preferred_capability: research
    model_preferences:
      - { provider: huggingface, model: deepseek-ai/DeepSeek-V3, priority: 1 }
      - { provider: google_gemini, model: gemini-2.5-flash, priority: 2 }
      - { provider: ollama, model: llama3.2:3b, priority: 3 }
    evidence_lens:
      source_types: [academic, arxiv, crossref, huggingface, upload]
      keywords: [study, paper, experiment, sample, benchmark, accuracy, correlation, peer-reviewed, preprint, limitation, variance]
    tool_permissions: [evidence_search, python_calculator]
    evaluation_criteria:
      - Study design quality, sample size, and peer-review status vs preprints
      - Statistical validity, effect size, and reproducibility
      - Confounders, correlation-vs-causation errors, and contradictory studies
      - Research gaps requiring controlled validation experiments
    bias_controls:
      - Never treat an AI statement or high citation count alone as proof
      - Explicitly distinguish preprints from peer-reviewed findings

  - advisor_id: devils_advocate
    name: Devil's Advocate
    title: Red-Team & Failure Mode Challenger
    role: Independent Adversarial Opposition
    priority: critical
    temperature: 0.4
    max_output_tokens: 3200
    preferred_capability: critical_reasoning
    model_preferences:
      - { provider: openrouter, model: deepseek/deepseek-r1:free, priority: 1 }
      - { provider: nvidia_nim, model: deepseek-ai/deepseek-r1, priority: 2 }
      - { provider: ollama, model: llama3.2:3b, priority: 3 }
    evidence_lens:
      source_types: [web, academic, github, huggingface, upload]
      keywords: [failure, risk, limitation, contradicted, outage, deprecated, flaw, assumption, warning, bottleneck, loss]
    tool_permissions: [evidence_search, python_calculator]
    evaluation_criteria:
      - Pre-mortem failure scenarios across technical, financial, market, legal, and security dimensions
      - Hidden optimistic assumptions and unstated external dependencies
      - Comparable failed initiatives and superior simpler alternatives
      - Conditions under which the proposal collapses vs falsification criteria
    bias_controls:
      - Never manufacture empty objections just to be contrarian; cite evidence/logic
      - Explicitly acknowledge when a point survives your strongest red-team attack

  - advisor_id: implementation_strategist
    name: Strategic Implementation Advisor
    title: Phased Execution & Roadmap Specialist
    role: Long-Term Strategy & Roadmap
    priority: medium
    temperature: 0.25
    max_output_tokens: 3200
    preferred_capability: planning
    model_preferences:
      - { provider: mistral, model: mistral-large-latest, priority: 1 }
      - { provider: groq, model: llama-3.3-70b-versatile, priority: 2 }
      - { provider: ollama, model: llama3.2:3b, priority: 3 }
    evidence_lens:
      source_types: [web, github, documentation, academic, upload]
      keywords: [roadmap, mvp, pilot, phase, partnership, kpi, milestone, scale, strategy, governance, exit]
    tool_permissions: [evidence_search]
    evaluation_criteria:
      - Strategic options comparison and minimum viable scope (MVP)
      - Phased delivery roadmap with owners, dependencies, and exit criteria
      - Pilot validation design, KPIs, and go/no-go decision gates
      - Long-term sustainability and pivot triggers
    bias_controls:
      - Never recommend full-scale launch before resolving critical feasibility constraints
      - Separate MVP deliverables from full-scale assumptions

chief_judge:
  agent_id: chief_judge
  name: Independent Chief Judge
  title: Eleventh Authority — Evidence-Grounded Adjudicator
  role: Final Feasibility Verdict
  temperature: 0.1
  max_output_tokens: 4500
  model_preferences:
    - { provider: google_gemini, model: gemini-2.5-pro, priority: 1 }
    - { provider: openrouter, model: deepseek/deepseek-r1:free, priority: 2 }
    - { provider: groq, model: llama-3.3-70b-versatile, priority: 3 }
    - { provider: ollama, model: llama3.2:3b, priority: 4 }
  independent_from_advisor_notes: true
  read_only_evidence: true
  allow_majority_vote_shortcut: false
